<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mi cuenta | San Martín</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=catalog-invitation-5"><link rel="stylesheet" href="account.css"><link rel="icon" type="image/png" href="assets/logotipo/logo-san-martin.png"></head><body><header class="account-header"><div class="container"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logotipo/logo-san-martin.png" alt="San Martín"><span><strong>San Martín</strong><small>papelería · librería</small></span></a><a class="text-link" href="index.html">← Seguir comprando</a></div></header><main class="account-shell container"><aside class="account-nav"><p class="eyebrow">MI CUENTA</p><h1 id="accountName">Hola</h1><button class="account-tab active" data-account-tab="perfil">Mis datos</button><button class="account-tab" data-account-tab="direccion">Mi dirección</button><button class="account-tab" data-account-tab="pedidos">Mis pedidos</button><button class="account-tab" data-account-tab="favoritos">Mis favoritos</button><button class="logout-button" id="logoutButton">Cerrar sesión</button></aside><section class="account-content"><div class="account-panel active" data-account-panel="perfil"><p class="eyebrow">INFORMACIÓN PERSONAL</p><h2>Mis datos</h2><form id="profileForm" class="account-form"><div class="form-grid"><label>Primer nombre<input name="nombre" required></label><label>Segundo nombre<input name="segundo_nombre"></label><label>Primer apellido<input name="apellido" required></label><label>Segundo apellido<input name="segundo_apellido"></label></div><label>Teléfono celular<input name="telefono" type="tel" autocomplete="tel"></label><label>Correo electrónico<input name="correo" type="email" disabled></label><button class="button button-dark" type="submit">Guardar cambios</button></form></div><div class="account-panel" data-account-panel="direccion"><p class="eyebrow">ENTREGA</p><h2>Mi única dirección</h2><p class="muted">Esta será la dirección utilizada al finalizar tus pedidos.</p><form id="addressForm" class="account-form"><div class="form-grid"><label>Nombre de la dirección<input name="nombre_direccion" placeholder="Ej. Casa, oficina"></label><label>Departamento<input name="departamento"></label><label>Municipio<input name="municipio"></label></div><label>Dirección completa<textarea name="direccion_completa" required></textarea></label><label>Referencia<textarea name="referencia_direccion" placeholder="Indicaciones para llegar"></textarea></label><button class="button button-dark" type="submit">Guardar dirección</button></form></div><div class="account-panel" data-account-panel="pedidos"><p class="eyebrow">COMPRAS</p><h2>Mis pedidos</h2><div id="ordersList" class="empty-state">Cargando pedidos…</div></div><div class="account-panel" data-account-panel="favoritos"><p class="eyebrow">GUARDADOS</p><h2>Mis favoritos</h2><div id="favoritesList" class="empty-state">Cargando favoritos…</div></div><p class="form-message" id="accountMessage" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script></body></html>
