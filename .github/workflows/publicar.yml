name: Publicar sitio y actualizar SEO
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [catalogo_actualizado]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Preparar entorno
        run: node scripts/preparar-pages.mjs
      - name: Generar fichas SEO desde Supabase
        run: node scripts/generar-seo-productos.mjs
      - name: Verificar HTML y sitemap
        run: node scripts/verificar-seo.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
